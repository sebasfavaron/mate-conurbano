<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cebar Mate</title>
<meta name="description" content="Cebale mate a la ronda en un patio del conurbano. Inclinás el termo despacito, no lavás la yerba y te acordás de quién dijo gracias.">
<meta name="theme-color" content="#ffffff">
<link rel="canonical" href="https://sebasfavaron.github.io/mate-conurbano/">
<link rel="icon" type="image/png" sizes="32x32" href="meta/icon-32.png">
<link rel="apple-touch-icon" href="meta/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta property="og:type" content="website">
<meta property="og:locale" content="es_AR">
<meta property="og:site_name" content="Cebar Mate">
<meta property="og:title" content="Cebar Mate">
<meta property="og:description" content="Cebale a la ronda en un patio del conurbano. Sin lavar la yerba.">
<meta property="og:url" content="https://sebasfavaron.github.io/mate-conurbano/">
<meta property="og:image" content="https://sebasfavaron.github.io/mate-conurbano/meta/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Un patio de tierra con cinco amigos alrededor de una mesa de plástico; abajo, dos manos ceban un mate con un termo verde.">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root { --ink: #1c1b19; --muted: #8b877f; --paper: #fff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--paper); color: var(--ink); }
  body { font: 13px/1.35 ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas { display: block; image-rendering: pixelated; touch-action: none; cursor: grab; outline: none; }
  canvas:active { cursor: grabbing; }
  .hud { position: fixed; left: max(16px, env(safe-area-inset-left)); right: max(16px, env(safe-area-inset-right)); display: flex; justify-content: space-between; gap: 16px; pointer-events: none; }
  #scores { position: fixed; top: max(14px, env(safe-area-inset-top)); left: max(16px, env(safe-area-inset-left)); display: grid; gap: 2px; pointer-events: none; }
  #scores b { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
  #scores span { color: var(--muted); }
  #scores b { display: inline-block; transform-origin: left center; }
  #scores b.bump { animation: bump .35s ease-out; }
  @keyframes bump { 30% { transform: scale(1.25); } }
  .pop { position: fixed; transform: translate(-50%, -100%); text-align: center; white-space: nowrap; pointer-events: none;
    animation: pop 2.1s ease-out forwards; text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 6px #fff; }
  .pop b { display: block; font-size: 16px; }
  .pop span { font-size: 12px; color: var(--muted); }
  .pop.great b { color: #2f7d32; } .pop.ok b { color: var(--ink); } .pop.bad b { color: #b3261e; }
  @keyframes pop { 0% { opacity: 0; transform: translate(-50%, -70%); } 12% { opacity: 1; transform: translate(-50%, -100%); }
    70% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -170%); } }
  @media (prefers-reduced-motion: reduce) { .pop { animation: popStill 2.1s forwards; } #scores b.bump { animation: none; }
    @keyframes popStill { 0%, 80% { opacity: 1; } 100% { opacity: 0; } } }
  #bottom { bottom: max(14px, env(safe-area-inset-bottom)); align-items: flex-end; }
  #status { color: var(--muted); max-width: 70ch; }
  .buttons { display: flex; gap: 24px; white-space: nowrap; }
  #nowplaying { position: fixed; top: max(40px, calc(env(safe-area-inset-top) + 26px)); right: max(16px, env(safe-area-inset-right));
    color: var(--muted); text-align: right; pointer-events: none; opacity: 0; transition: opacity 2.5s ease; max-width: 60vw; }
  #nowplaying.on { opacity: 1; }
  #nowplaying b { color: var(--ink); font-weight: 600; }
  #lesson { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(255, 255, 255, .35); cursor: pointer; }
  #lesson[hidden] { display: none; }
  #lesson div { background: var(--paper); border: 1px solid var(--ink); padding: 14px 20px; max-width: min(380px, calc(100vw - 32px));
    text-align: center; line-height: 1.5; animation: lessonIn .35s ease-out; }
  #lesson b { font-size: 16px; }
  #lesson p { margin: 6px 0 10px; }
  #lesson small { color: var(--muted); }
  @keyframes lessonIn { from { opacity: 0; transform: translateY(6px); } }
  @media (prefers-reduced-motion: reduce) { #lesson div { animation: none; } }
  #paused { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; font-size: 15px; }
  #paused[hidden] { display: none; }
  #paused span { background: var(--paper); padding: 6px 14px; border: 1px solid var(--ink); }
  button { pointer-events: auto; font: inherit; color: var(--muted); background: none; border: 0; padding: 10px; margin: -10px; cursor: pointer; }
  button:hover, button:focus-visible { color: var(--ink); }
  #rules-open { position: fixed; top: max(14px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right)); }
  #bubbles { position: fixed; inset: 0; pointer-events: none; }
  .bubble { position: absolute; transform: translate(-50%, -100%); background: var(--paper); color: var(--ink); border: 1px solid var(--ink);
    padding: 3px 6px; white-space: nowrap; font-size: 12px; margin-top: -6px; }
  .bubble.warn { border-color: #b7791f; color: #6b4a12; background: #fffaf0; }
  .bubble.warn::after { border-color: #b7791f; background: #fffaf0; }
  .bubble::after { content: ''; position: absolute; left: 50%; bottom: -5px; width: 7px; height: 7px; background: var(--paper);
    border-right: 1px solid var(--ink); border-bottom: 1px solid var(--ink); transform: translateX(-50%) rotate(45deg); }
  #end { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; }
  #end[hidden] { display: none; }
  #end div { background: var(--paper); padding: 14px 22px; text-align: center; line-height: 1.6; pointer-events: auto; }
  #end p { margin: 0; }
  #end p:first-child { font-size: 18px; font-weight: 600; }
  #end p.muted { color: var(--muted); }
  #end button { margin: 8px 0 0; padding: 4px 10px; border: 1px solid var(--ink); color: var(--ink); }
  #end button.quiet { border-color: transparent; color: var(--muted); }
  dialog { border: 1px solid var(--ink); padding: 18px 22px; max-width: min(460px, calc(100vw - 32px)); font: inherit; color: var(--ink); }
  dialog::backdrop { background: rgba(255, 255, 255, .7); }
  dialog ol { padding-left: 20px; margin: 0 0 12px; line-height: 1.5; }
  dialog li { margin: 0 0 6px; }
  dialog button { margin: 0; padding: 4px 10px; border: 1px solid var(--ink); color: var(--ink); }
  dialog button.quiet { border-color: transparent; color: var(--muted); margin-left: 8px; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" tabindex="0" aria-label="Patio del conurbano con una mesa de plástico. Mantené espacio, arrastrá hacia abajo o apretá el gatillo para inclinar el termo y cebar el mate. Con Shift inclinás más despacio."></canvas></div>
<div id="scores"><b id="total">0</b><span id="mates">0 mates</span><span id="best"></span></div>
<button id="rules-open" type="button" aria-haspopup="dialog" aria-label="reglas">?</button>
<div id="bubbles" aria-hidden="true"></div>
<div id="end" hidden><div></div></div>
<div id="nowplaying" aria-live="off"></div>
<div id="lesson" hidden></div>
<div id="paused" hidden><span>en pausa · P para seguir</span></div>
<div class="hud" id="bottom">
  <div id="status" role="status" aria-live="polite"></div>
  <span class="buttons"><button id="pause" type="button" aria-pressed="false">pausa</button> <button id="mute" type="button" aria-pressed="false">sonido: sí</button></span>
</div>
<dialog id="rules">
  <ol></ol>
  <form method="dialog"><button>listo</button> <button type="button" id="relearn" class="quiet">ver las explicaciones de nuevo</button></form>
</dialog>
<script>window.PP_SCENE = { originY: -10, shadowX: 1.1, shadowY: -.2 };</script>
<script src="engine.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
